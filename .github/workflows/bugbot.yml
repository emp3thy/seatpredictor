name: Claude BugBot

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bugbot:
    name: Claude BugBot review
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Claude BugBot
        # Pinned to a commit SHA, not @main. This is a third-party action holding
        # pull-requests: write and a Claude credential — a moving ref means an
        # upstream compromise reaches this repo with no change on our side.
        # ac1a67d = v1.0.12. Bump deliberately after reading the diff.
        uses: rekpero/claude-bugbot-github-action@ac1a67d11a0403a4a6a2db907fa12e6d28b15ee5
        with:
          claude-setup-token: ${{ secrets.CLAUDE_SETUP_TOKEN }}
